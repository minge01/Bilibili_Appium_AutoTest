# pytest 配置
[pytest]
testpaths = test_cases
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = --alluredir=reports/allure-results
markers =
    smoke: 冒烟测试集（核心链路，每次提交必跑，执行快）
    regression: 回归测试集（完整功能验证，冒烟用例默认也属于回归集）
    slow: 执行较慢的用例（依赖网络/视频加载，可用 -m "not slow" 跳过）
filterwarnings =
    ignore::pytest.PytestUnhandledThreadExceptionWarning
    ignore::DeprecationWarning:appium
log_cli = True
